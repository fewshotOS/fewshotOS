[package]
name = "fewshot-models"
description = "Local Ollama-backed planner and reader (Qwen)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fewshot-gate.workspace = true
fewshot-plan.workspace = true
fewshot-executor.workspace = true
serde = { workspace = true, features = ["std"] }
