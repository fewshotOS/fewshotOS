[workspace]
resolver = "3"
members = ["libs/labels", "libs/labeld", "libs/host", "libs/gate", "libs/plan", "libs/executor", "libs/models", "libs/harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
fewshot-labels = { path = "libs/labels" }
fewshot-labeld = { path = "libs/labeld" }
fewshot-host = { path = "libs/host", default-features = false }
fewshot-gate = { path = "libs/gate" }
fewshot-plan = { path = "libs/plan" }
fewshot-executor = { path = "libs/executor" }
serde = { version = "1.0.210", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.140", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10.9", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false }
proptest = "1.10.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
